<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos Figuritas 2026</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #f0f2f5; color: #333; }
        .card { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-next { background: #007bff; color: white; }
        .btn-send { background: #28a745; color: white; }
        .btn-back { background: #6c757d; color: white; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .equipo-btn { background: #fff; border: 2px solid #007bff; color: #007bff; padding: 10px; border-radius: 8px; text-align: center; }
        .fig-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .fig-item { padding: 10px; border: 1px solid #ddd; border-radius: 5px; text-align: center; cursor: pointer; font-size: 0.8em; }
        .seleccionada { background: #28a745 !important; color: white; border-color: #1e7e34; }
        h2, h3 { text-align: center; color: #0056b3; }
    </style>
</head>
<body>

<div class="card">
    <div id="paso1">
        <h2>Registro</h2>
        <input type="text" id="nombre" placeholder="Tu Nombre Completo">
        <input type="text" id="curso" placeholder="Curso (Ej: 5to A)">
        <input type="text" id="telefono" placeholder="Teléfono del Padre/Madre">
        <button class="btn-next" onclick="irAPaso(2)">Ver Equipos</button>
    </div>

    <div id="paso2" class="hidden">
        <h3>Selecciona un Equipo</h3>
        <div id="lista-equipos" class="grid"></div>
        <button class="btn-send" onclick="enviarPedido()">✅ TERMINAR Y ENVIAR</button>
    </div>

    <div id="paso3" class="hidden">
        <h3 id="titulo-equipo"></h3>
        <div id="lista-figuritas" class="fig-grid"></div>
        <button class="btn-back" onclick="irAPaso(2)">Volver a la lista</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBrv-eom8y5hvL5Uun7cqGfhyPNlrl_pQ0",
        authDomain: "figuritas2026-cc119.firebaseapp.com",
        projectId: "figuritas2026-cc119",
        storageBucket: "figuritas2026-cc119.firebasestorage.app",
        messagingSenderId: "238600944932",
        appId: "1:238600944932:web:1a2c87e4131e00304607b1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // DATOS DE LOS EQUIPOS [cite: 3]
    // DATOS COMPLETOS DE LOS EQUIPOS SEGÚN EL PDF
    const EQUIPOS = [
        { id: "FWC", nombre: "FIFA / Especiales", cant: 19 },
        { id: "MEX", nombre: "México", cant: 20 },
        { id: "RSA", nombre: "Sudáfrica", cant: 20 },
        { id: "KOR", nombre: "Corea del Sur", cant: 20 },
        { id: "CZE", nombre: "Rep. Checa", cant: 20 },
        { id: "CAN", nombre: "Canadá", cant: 20 },
        { id: "BIH", nombre: "Bosnia", cant: 20 },
        { id: "QAT", nombre: "Qatar", cant: 20 },
        { id: "SUI", nombre: "Suiza", cant: 20 },
        { id: "BRA", nombre: "Brasil", cant: 20 },
        { id: "MAR", nombre: "Marruecos", cant: 20 },
        { id: "HAI", nombre: "Haití", cant: 20 },
        { id: "SCO", nombre: "Escocia", cant: 20 },
        { id: "USA", nombre: "USA", cant: 20 },
        { id: "PAR", nombre: "Paraguay", cant: 20 },
        { id: "AUS", nombre: "Australia", cant: 20 },
        { id: "TUR", nombre: "Turquía", cant: 20 },
        { id: "GER", nombre: "Alemania", cant: 20 },
        { id: "CUW", nombre: "Curazao", cant: 20 },
        { id: "CIV", nombre: "Costa de Marfil", cant: 20 },
        { id: "ECU", nombre: "Ecuador", cant: 20 },
        { id: "NED", nombre: "Países Bajos", cant: 20 },
        { id: "JPN", nombre: "Japón", cant: 20 },
        { id: "SWE", nombre: "Suecia", cant: 20 },
        { id: "TUN", nombre: "Túnez", cant: 20 },
        { id: "BEL", nombre: "Bélgica", cant: 20 },
        { id: "EGY", nombre: "Egipto", cant: 20 },
        { id: "IRN", nombre: "Irán", cant: 20 },
        { id: "NZL", nombre: "Nueva Zelanda", cant: 20 },
        { id: "ESP", nombre: "España", cant: 20 },
        { id: "CPV", nombre: "Cabo Verde", cant: 20 },
        { id: "KSA", nombre: "Arabia Saudita", cant: 20 },
        { id: "URU", nombre: "Uruguay", cant: 20 },
        { id: "FRA", nombre: "Francia", cant: 20 },
        { id: "SEN", nombre: "Senegal", cant: 20 },
        { id: "IRQ", nombre: "Irak", cant: 20 },
        { id: "NOR", nombre: "Noruega", cant: 20 },
        { id: "ARG", nombre: "Argentina", cant: 20 },
        { id: "ALG", nombre: "Argelia", cant: 20 },
        { id: "AUT", nombre: "Austria", cant: 20 },
        { id: "JOR", nombre: "Jordania", cant: 20 },
        { id: "POR", nombre: "Portugal", cant: 20 },
        { id: "COD", nombre: "RD Congo", cant: 20 },
        { id: "UZB", nombre: "Uzbekistán", cant: 20 },
        { id: "COL", nombre: "Colombia", cant: 20 },
        { id: "ENG", nombre: "Inglaterra", cant: 20 },
        { id: "CRO", nombre: "Croacia", cant: 20 },
        { id: "GHA", nombre: "Ghana", cant: 20 },
        { id: "PAN", nombre: "Panamá", cant: 20 },
        { id: "CC", nombre: "Coca-Cola", cant: 14 }
    ];

    let carrito = {}; 

    window.irAPaso = function(paso) {
        document.getElementById('paso1').classList.add('hidden');
        document.getElementById('paso2').classList.add('hidden');
        document.getElementById('paso3').classList.add('hidden');
        document.getElementById('paso' + paso).classList.remove('hidden');
    };

    function renderEquipos() {
        const div = document.getElementById('lista-equipos');
        EQUIPOS.forEach(eq => {
            const btn = document.createElement('div');
            btn.className = 'equipo-btn';
            btn.innerText = eq.nombre;
            btn.onclick = () => verDetalle(eq);
            div.appendChild(btn);
        });
    }

    function verDetalle(eq) {
        document.getElementById('titulo-equipo').innerText = eq.nombre;
        const div = document.getElementById('lista-figuritas');
        div.innerHTML = '';
        
        for (let i = 1; i <= eq.cant; i++) {
            const idFig = eq.id + i;
            const item = document.createElement('div');
            item.className = 'fig-item' + (carrito[idFig] ? ' seleccionada' : '');
            item.innerText = idFig;
            item.onclick = () => {
                if (carrito[idFig]) {
                    delete carrito[idFig];
                    item.classList.remove('seleccionada');
                } else {
                    carrito[idFig] = true;
                    item.classList.add('seleccionada');
                }
            };
            div.appendChild(item);
        }
        irAPaso(3);
    }

    window.enviarPedido = async function() {
        const nombre = document.getElementById('nombre').value;
        if (!nombre || Object.keys(carrito).length === 0) {
            alert("Por favor completa tu nombre y elige al menos una figurita");
            return;
        }

        try {
            await addDoc(collection(db, "pedidos"), {
                usuario: nombre,
                curso: document.getElementById('curso').value,
                telefono: document.getElementById('telefono').value,
                figuritas: Object.keys(carrito),
                fecha: new Date().toLocaleString()
            });
            alert("¡Pedido enviado con éxito!");
            location.reload();
        } catch (e) {
            alert("Error al enviar: " + e);
        }
    };

    renderEquipos();
</script>

</body>
</html>
